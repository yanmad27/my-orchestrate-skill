      <stop offset="0.55" stop-color="#241034"/>
      <stop offset="1" stop-color="#100A20"/>
    </linearGradient>
    <linearGradient id="a-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1A8"/>
      <stop offset="0.3" stop-color="#F2C45C"/>
      <stop offset="0.72" stop-color="#B76627"/>
      <stop offset="1" stop-color="#6F321C"/>
    </linearGradient>
    <radialGradient id="a-hall" cx="50%" cy="30%" r="74%">
